<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grow Mate — Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090b;
      --card: #121419;
      --text: #f5f5f2;
      --muted: #92959e;
      --line: rgba(255,255,255,.10);
      --accent: #b8ff3d;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(184,255,61,.10),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 40px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }

    .logo span {
      color: var(--accent);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 34px;
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #c8cad0;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #0b0d10;
      color: white;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(184,255,61,.55);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 50px;
      padding: 15px;
      margin-top: 8px;
      background: var(--accent);
      color: #080a06;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #c8ff68;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      color: #ff6978;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      GROW<span>MATE</span>
    </div>

    <div class="eyebrow">
      ADMIN ACCESS
    </div>

    <h1>
      Welcome back.
    </h1>

    <p class="subtitle">
      Sign in to manage your Grow Mate leads.
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">EMAIL</label>
        <input
          type="email"
          id="email"
          placeholder="admin@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input
          type="password"
          id="password"
          placeholder="Your password"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        Sign In →
      </button>

      <p id="message"></p>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ftukdnfklkhpmlvdfphj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Tm7yIAQyPuN35j7za2i9AQ_FHDASoDw";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";
      message.textContent = "";


      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        console.error(error);

        message.textContent =
          "Invalid email or password.";

        loginButton.disabled = false;
        loginButton.textContent = "Sign In →";

        return;
      }


      window.location.href = "admin.html";

    });

  </script>

</body>
</html>
