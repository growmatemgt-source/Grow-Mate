<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grow Mate — Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090d;
      --panel: #101219;
      --panel-2: #151821;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8d94a5;
      --accent: #00aaff;
      --accent-2: #006eff;
      --green: #28d17c;
      --yellow: #f5c451;
      --red: #ff5d6c;
      --purple: #9b7cff;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 80% 0%, rgba(0,170,255,.10), transparent 28%),
        radial-gradient(circle at 0% 100%, rgba(111,60,255,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    select {
      font-family: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: rgba(10,11,16,.92);
      border-right: 1px solid var(--border);
      padding: 28px 18px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 20;
    }

    .logo {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -1px;
      padding: 0 12px;
      margin-bottom: 45px;
    }

    .logo span {
      color: var(--accent);
    }

    .side-label {
      color: #555d6d;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 0 12px;
      margin-bottom: 10px;
    }

    .side-link {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      margin-bottom: 4px;
      transition: .2s ease;
    }

    .side-link:hover,
    .side-link.active {
      background: rgba(0,170,255,.10);
      color: white;
    }

    .side-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-bottom {
      position: absolute;
      bottom: 25px;
      left: 18px;
      right: 18px;
    }

    .site-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      display: block;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      transition: .2s;
    }

    .site-link:hover {
      color: white;
      border-color: rgba(0,170,255,.4);
    }

    /* MAIN */

    .main {
      width: calc(100% - 250px);
      margin-left: 250px;
      padding: 38px 42px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 34px;
      letter-spacing: -1.5px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      background: rgba(40,209,124,.08);
      border: 1px solid rgba(40,209,124,.18);
      color: var(--green);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(40,209,124,.8);
    }

    .refresh-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      transition: .2s;
    }

    .refresh-btn:hover {
      border-color: rgba(0,170,255,.5);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 21px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      right: -35px;
      top: -35px;
      background: rgba(0,170,255,.08);
      filter: blur(5px);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 13px;
    }

    .stat-number {
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      font-weight: 700;
    }

    .stat-icon {
      position: absolute;
      right: 20px;
      bottom: 20px;
      font-size: 22px;
    }

    /* CONTENT */

    .content-panel {
      background: rgba(16,18,25,.82);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .panel-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .panel-head h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
    }

    .filters {
      display: flex;
      gap: 9px;
    }

    .search {
      background: #0b0d12;
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      width: 210px;
      outline: none;
    }

    .search:focus {
      border-color: rgba(0,170,255,.5);
    }

    .filter {
      background: #0b0d12;
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      cursor: pointer;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      color: #666e7d;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 700;
      text-align: left;
      padding: 15px 20px;
      background: rgba(255,255,255,.015);
    }

    td {
      padding: 17px 20px;
      border-top: 1px solid var(--border);
      color: #dce0e8;
      font-size: 13px;
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255,255,255,.018);
    }

    .client-name {
      color: white;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .client-email {
      color: #747c8d;
      font-size: 11px;
    }

    .service {
      color: #c7ccd7;
    }

    .date {
      color: #858c9b;
      font-size: 12px;
    }

    .status-select {
      border-radius: 999px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: #10131a;
      color: white;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }

    .status-select.new {
      color: var(--accent);
      border-color: rgba(0,170,255,.25);
    }

    .status-select.contacted {
      color: #64b5ff;
    }

    .status-select.progress {
      color: var(--yellow);
    }

    .status-select.completed {
      color: var(--green);
    }

    .status-select.cancelled {
      color: var(--red);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid var(--border);
      color: #aeb5c2;
      background: #10131a;
      padding: 7px 9px;
      border-radius: 7px;
      font-size: 11px;
      margin-right: 4px;
    }

    .action-btn:hover {
      color: white;
      border-color: rgba(0,170,255,.4);
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
      display: none;
    }

    .empty strong {
      display: block;
      color: white;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .loading {
      padding: 55px;
      text-align: center;
      color: var(--muted);
    }

    /* RESPONSIVE */

    @media (max-width: 1050px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 800px) {

      .sidebar {
        width: 70px;
        padding: 22px 9px;
      }

      .logo {
        font-size: 0;
        padding: 0;
        text-align: center;
        width: 100%;
      }

      .logo::before {
        content: "GM";
        font-size: 20px;
        color: var(--accent);
      }

      .side-label,
      .side-link span:not(.side-icon),
      .site-link {
        display: none;
      }

      .side-link {
        justify-content: center;
        padding: 13px 5px;
      }

      .sidebar-bottom {
        left: 9px;
        right: 9px;
      }

      .main {
        width: calc(100% - 70px);
        margin-left: 70px;
        padding: 25px 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      h1 {
        font-size: 27px;
      }

      .filters {
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .panel-head {
        align-items: stretch;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 24px;
      }

      .stat-icon {
        display: none;
      }

      .top-right {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <a href="index.html" class="logo">
        GROW<span>MATE</span>
      </a>

      <div class="side-label">
        MANAGEMENT
      </div>

      <button class="side-link active">
        <span class="side-icon">▦</span>
        <span>Leads</span>
      </button>

      <button class="side-link">
        <span class="side-icon">◷</span>
        <span>Activity</span>
      </button>

      <button class="side-link">
        <span class="side-icon">⚙</span>
        <span>Settings</span>
      </button>


      <div class="sidebar-bottom">

        <a
          href="index.html"
          class="site-link"
        >
          ← Back to Website
        </a>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <div class="topbar">

        <div>
          <div class="eyebrow">
            GROW MATE / ADMIN
          </div>

          <h1>
            Lead Dashboard
          </h1>
        </div>

        <div class="top-right">

          <div class="live">
            <span class="live-dot"></span>
            LIVE
          </div>

          <button
            class="refresh-btn"
            id="refreshBtn"
          >
            ↻ Refresh
          </button>

        </div>

      </div>


      <!-- STATS -->

      <section class="stats">

        <div class="stat-card">
          <div class="stat-label">TOTAL LEADS</div>
          <div class="stat-number" id="totalLeads">0</div>
          <div class="stat-icon">◉</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">NEW</div>
          <div class="stat-number" id="newLeads">0</div>
          <div class="stat-icon">✦</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">IN PROGRESS</div>
          <div class="stat-number" id="progressLeads">0</div>
          <div class="stat-icon">◌</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">COMPLETED</div>
          <div class="stat-number" id="completedLeads">0</div>
          <div class="stat-icon">✓</div>
        </div>

      </section>


      <!-- LEADS -->

      <section class="content-panel">

        <div class="panel-head">

          <h2>
            Recent Leads
          </h2>

          <div class="filters">

            <input
              type="search"
              id="searchInput"
              class="search"
              placeholder="Search leads..."
            >

            <select
              id="statusFilter"
              class="filter"
            >
              <option value="all">All Status</option>
              <option value="New">New</option>
              <option value="Contacted">Contacted</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>

          </div>

        </div>


        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>CLIENT</th>
                <th>PHONE</th>
                <th>SERVICE</th>
                <th>MESSAGE</th>
                <th>DATE</th>
                <th>STATUS</th>
                <th>ACTION</th>
              </tr>
            </thead>

            <tbody id="leadsBody">

              <tr>
                <td colspan="7">
                  <div class="loading">
                    Loading leads...
                  </div>
                </td>
              </tr>

            </tbody>

          </table>

        </div>


        <div
          class="empty"
          id="emptyState"
        >
          <strong>No leads found</strong>
          Try changing your search or filter.
        </div>

      </section>

    </main>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* ==========================================
       GROW MATE ADMIN DASHBOARD
       ========================================== */

    const SUPABASE_URL =
      "https://ftukdnfklkhpmlvdfphj.supabase.co";

    /*
      IMPORTANT:
      Yahan apni SUPABASE PUBLISHABLE KEY paste karni hai.
      Secret/service_role key KABHI yahan mat lagana.
    */

    const SUPABASE_KEY =
      sb_publishable_Tm7yIAQyPuN35j7za2i9AQ_FHDASoDw
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let allLeads = [];


    /* ---------- DOM ---------- */

    const leadsBody =
      document.getElementById("leadsBody");

    const emptyState =
      document.getElementById("emptyState");

    const searchInput =
      document.getElementById("searchInput");

    const statusFilter =
      document.getElementById("statusFilter");

    const refreshBtn =
      document.getElementById("refreshBtn");


    /* ---------- LOAD LEADS ---------- */

    async function loadLeads() {

      leadsBody.innerHTML = `
        <tr>
          <td colspan="7">
            <div class="loading">
              Loading leads...
            </div>
          </td>
        </tr>
      `;

      const { data, error } = await supabaseClient
        .from("leads")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error("Supabase error:", error);

        leadsBody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="loading">
                Could not load leads.
                Check Supabase permissions.
              </div>
            </td>
          </tr>
        `;

        return;
      }

      allLeads = data || [];

      updateStats();
      renderLeads();

    }


    /* ---------- STATS ---------- */

    function updateStats() {

      const total =
        allLeads.length;

      const newCount =
        allLeads.filter(
          lead => lead.status === "New"
        ).length;

      const progressCount =
        allLeads.filter(
          lead => lead.status === "In Progress"
        ).length;

      const completedCount =
        allLeads.filter(
          lead => lead.status === "Completed"
        ).length;


      document.getElementById("totalLeads")
        .textContent = total;

      document.getElementById("newLeads")
        .textContent = newCount;

      document.getElementById("progressLeads")
        .textContent = progressCount;

      document.getElementById("completedLeads")
        .textContent = completedCount;

    }


    /* ---------- RENDER ---------- */

    function renderLeads() {

      const search =
        searchInput.value
          .toLowerCase()
          .trim();

      const filter =
        statusFilter.value;


      const filtered =
        allLeads.filter(lead => {

          const matchesSearch =
            !search ||
            String(lead.name || "")
              .toLowerCase()
              .includes(search) ||
            String(lead.email || "")
              .toLowerCase()
              .includes(search) ||
            String(lead.phone || "")
              .toLowerCase()
              .includes(search) ||
            String(lead.service || "")
              .toLowerCase()
              .includes(search);


          const matchesStatus =
            filter === "all" ||
            lead.status === filter;


          return matchesSearch && matchesStatus;

        });


      if (!filtered.length) {

        leadsBody.innerHTML = "";

        emptyState.style.display = "block";

        return;

      }

      emptyState.style.display = "none";


      leadsBody.innerHTML =
        filtered.map(lead => {

          const date =
            lead.created_at
              ? new Date(
                  lead.created_at
                ).toLocaleString()
              : "—";


          const phone =
            lead.phone || "—";

          const whatsappNumber =
            phone
              .replace(/\D/g, "");


          const whatsappLink =
            whatsappNumber
              ? `https://wa.me/${whatsappNumber}`
              : "#";


          const status =
            lead.status || "New";


          let statusClass =
            "new";

          if (status === "Contacted")
            statusClass = "contacted";

          if (status === "In Progress")
            statusClass = "progress";

          if (status === "Completed")
            statusClass = "completed";

          if (status === "Cancelled")
            statusClass = "cancelled";


          return `

            <tr>

              <td>

                <div class="client-name">
                  ${escapeHTML(lead.name || "Unknown")}
                </div>

                <div class="client-email">
                  ${escapeHTML(lead.email || "No email")}
                </div>

              </td>


              <td>
                ${escapeHTML(phone)}
              </td>


              <td class="service">
                ${escapeHTML(lead.service || "—")}
              </td>


              <td>
                ${escapeHTML(
                  lead.message || "—"
                )}
              </td>


              <td class="date">
                ${escapeHTML(date)}
              </td>


              <td>

                <select
                  class="status-select ${statusClass}"
                  data-id="${lead.id}"
                >

                  <option
                    value="New"
                    ${status === "New" ? "selected" : ""}
                  >
                    New
                  </option>

                  <option
                    value="Contacted"
                    ${status === "Contacted" ? "selected" : ""}
                  >
                    Contacted
                  </option>

                  <option
                    value="In Progress"
                    ${status === "In Progress" ? "selected" : ""}
                  >
                    In Progress
                  </option>

                  <option
                    value="Completed"
                    ${status === "Completed" ? "selected" : ""}
                  >
                    Completed
                  </option>

                  <option
                    value="Cancelled"
                    ${status === "Cancelled" ? "selected" : ""}
                  >
                    Cancelled
                  </option>

                </select>

              </td>


              <td>

                ${
                  phone
                    ? `
                      <a
                        class="action-btn"
                        href="${whatsappLink}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        WhatsApp
                      </a>
                    `
                    : ""
                }


                ${
                  lead.email
                    ? `
                      <a
                        class="action-btn"
                        href="mailto:${escapeHTML(lead.email)}"
                      >
                        Email
                      </a>
                    `
                    : ""
                }

              </td>

            </tr>

          `;

        }).join("");


      document
        .querySelectorAll(".status-select")
        .forEach(select => {

          select.addEventListener(
            "change",
            async function() {

              await updateStatus(
                this.dataset.id,
                this.value
              );

            }
          );

        });

    }


    /* ---------- UPDATE STATUS ---------- */

    async function updateStatus(
      id,
      status
    ) {

      const { error } =
        await supabaseClient
          .from("leads")
          .update({
            status: status
          })
          .eq("id", id);


      if (error) {

        console.error(
          "Status update error:",
          error
        );

        alert(
          "Status update failed."
        );

        return;

      }


      const lead =
        allLeads.find(
          item => item.id === id
        );

      if (lead) {
        lead.status = status;
      }

      updateStats();
      renderLeads();

    }


    /* ---------- SEARCH ---------- */

    searchInput.addEventListener(
      "input",
      renderLeads
    );


    statusFilter.addEventListener(
      "change",
      renderLeads
    );


    refreshBtn.addEventListener(
      "click",
      loadLeads
    );


    /* ---------- SECURITY HELPER ---------- */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ---------- START ---------- */

    loadLeads();

  </script>

</body>
</html>
