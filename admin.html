<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grow Mate — Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* =========================================================
       GROW MATE COLORS
    ========================================================= */

    :root {
      --bg: #08090b;
      --bg-soft: #101216;
      --card: #121419;
      --card-2: #151821;

      --text: #f5f5f2;
      --muted: #92959e;

      --line: rgba(255,255,255,.10);

      --accent: #b8ff3d;
      --accent-dark: #8bcf18;

      --green: #28d17c;
      --yellow: #f5c451;
      --red: #ff5d6c;

      --max: 1180px;
    }


    /* =========================================================
       BODY
    ========================================================= */

    body {
      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(184,255,61,.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(184,255,61,.055),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);

      min-height: 100vh;

      overflow-x: hidden;
    }


    button,
    input,
    select {
      font-family: inherit;
    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {
      display: flex;
      min-height: 100vh;
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: 250px;

      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          rgba(18,20,25,.96),
          rgba(8,9,11,.96)
        );

      border-right: 1px solid var(--line);

      padding: 28px 18px;

      position: fixed;

      left: 0;
      top: 0;
      bottom: 0;

      z-index: 20;
    }


    .logo {
      display: inline-block;

      color: white;

      text-decoration: none;

      font-family: "Space Grotesk", sans-serif;

      font-size: 22px;

      font-weight: 700;

      letter-spacing: -1px;

      padding: 0 12px;

      margin-bottom: 45px;
    }


    .logo span {
      color: var(--accent);
    }


    .side-label {
      color: #666a72;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1.5px;

      padding: 0 12px;

      margin-bottom: 10px;
    }


    .side-link {
      width: 100%;

      border: 0;

      background: transparent;

      color: var(--muted);

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px 12px;

      border-radius: 10px;

      cursor: pointer;

      text-align: left;

      font-size: 14px;

      margin-bottom: 4px;

      transition: .2s ease;
    }


    .side-link:hover,
    .side-link.active {
      background: rgba(184,255,61,.08);

      color: white;
    }


    .side-link.active {
      box-shadow:
        inset 3px 0 0 var(--accent);
    }


    .side-icon {
      width: 20px;

      text-align: center;

      font-size: 16px;

      color: var(--accent);
    }


    .sidebar-bottom {
      position: absolute;

      bottom: 25px;

      left: 18px;

      right: 18px;
    }


    .site-link {
      color: var(--muted);

      text-decoration: none;

      font-size: 13px;

      display: block;

      padding: 12px;

      border: 1px solid var(--line);

      border-radius: 10px;

      text-align: center;

      transition: .2s;
    }


    .site-link:hover {
      color: white;

      border-color: rgba(184,255,61,.4);

      background: rgba(184,255,61,.04);
    }


    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      width: calc(100% - 250px);

      margin-left: 250px;

      padding: 38px 42px;
    }


    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 35px;
    }


    .eyebrow {
      color: var(--accent);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }


    h1 {
      font-family: "Space Grotesk", sans-serif;

      font-size: 34px;

      letter-spacing: -1.5px;
    }


    .top-right {
      display: flex;

      align-items: center;

      gap: 12px;
    }


    /* =========================================================
       LIVE
    ========================================================= */

    .live {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 9px 13px;

      background: rgba(184,255,61,.07);

      border: 1px solid rgba(184,255,61,.20);

      color: var(--accent);

      border-radius: 999px;

      font-size: 12px;

      font-weight: 600;
    }


    .live-dot {
      width: 7px;

      height: 7px;

      background: var(--accent);

      border-radius: 50%;

      box-shadow: 0 0 10px rgba(184,255,61,.8);
    }


    .refresh-btn {
      border: 1px solid var(--line);

      background: var(--card);

      color: white;

      border-radius: 9px;

      padding: 10px 14px;

      cursor: pointer;

      transition: .2s;
    }


    .refresh-btn:hover {
      border-color: rgba(184,255,61,.5);

      color: var(--accent);
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 16px;

      margin-bottom: 28px;
    }


    .stat-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.018)
        );

      border: 1px solid var(--line);

      border-radius: 16px;

      padding: 21px;

      position: relative;

      overflow: hidden;

      transition: .25s;
    }


    .stat-card:hover {
      transform: translateY(-3px);

      border-color: rgba(184,255,61,.22);
    }


    .stat-card::after {
      content: "";

      position: absolute;

      width: 90px;

      height: 90px;

      border-radius: 50%;

      right: -35px;

      top: -35px;

      background: rgba(184,255,61,.07);

      filter: blur(5px);
    }


    .stat-label {
      color: var(--muted);

      font-size: 12px;

      margin-bottom: 13px;
    }


    .stat-number {
      font-family: "Space Grotesk", sans-serif;

      font-size: 30px;

      font-weight: 700;
    }


    .stat-icon {
      position: absolute;

      right: 20px;

      bottom: 20px;

      font-size: 22px;

      color: var(--accent);
    }


    /* =========================================================
       CONTENT PANEL
    ========================================================= */

    .content-panel {
      background: rgba(16,18,22,.86);

      border: 1px solid var(--line);

      border-radius: 18px;

      overflow: hidden;

      box-shadow: 0 25px 70px rgba(0,0,0,.20);
    }


    .panel-head {
      padding: 20px 22px;

      border-bottom: 1px solid var(--line);

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;
    }


    .panel-head h2 {
      font-family: "Space Grotesk", sans-serif;

      font-size: 18px;
    }


    /* =========================================================
       FILTERS
    ========================================================= */

    .filters {
      display: flex;

      gap: 9px;
    }


    .search {
      background: #0b0d0f;

      color: white;

      border: 1px solid var(--line);

      border-radius: 8px;

      padding: 10px 12px;

      width: 210px;

      outline: none;
    }


    .search::placeholder {
      color: #5f646d;
    }


    .search:focus {
      border-color: rgba(184,255,61,.5);
    }


    .filter {
      background: #0b0d0f;

      color: white;

      border: 1px solid var(--line);

      border-radius: 8px;

      padding: 10px 12px;

      outline: none;

      cursor: pointer;
    }


    .filter:focus {
      border-color: rgba(184,255,61,.5);
    }


    .filter option {
      background: #111318;

      color: white;
    }


    /* =========================================================
       TABLE
    ========================================================= */

    .table-wrap {
      width: 100%;

      overflow-x: auto;
    }


    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 900px;
    }


    th {
      color: #666a72;

      font-size: 10px;

      letter-spacing: 1.2px;

      text-transform: uppercase;

      font-weight: 700;

      text-align: left;

      padding: 15px 20px;

      background: rgba(255,255,255,.015);
    }


    td {
      padding: 17px 20px;

      border-top: 1px solid var(--line);

      color: #dce0e8;

      font-size: 13px;

      vertical-align: middle;
    }


    tr:hover td {
      background: rgba(184,255,61,.018);
    }


    .client-name {
      color: white;

      font-weight: 600;

      margin-bottom: 4px;
    }


    .client-email {
      color: #747a83;

      font-size: 11px;
    }


    .service {
      color: #c7ccd7;
    }


    .date {
      color: #858c94;

      font-size: 12px;
    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status-select {
      border-radius: 999px;

      padding: 6px 10px;

      border: 1px solid var(--line);

      background: #101318;

      color: white;

      font-size: 11px;

      cursor: pointer;

      outline: none;
    }


    .status-select.new {
      color: var(--accent);

      border-color: rgba(184,255,61,.25);
    }


    .status-select.contacted {
      color: #8ec8ff;
    }


    .status-select.progress {
      color: var(--yellow);
    }


    .status-select.completed {
      color: var(--green);
    }


    .status-select.cancelled {
      color: var(--red);
    }


    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .action-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      border: 1px solid var(--line);

      color: #aeb5c2;

      background: #101318;

      padding: 7px 9px;

      border-radius: 7px;

      font-size: 11px;

      margin-right: 4px;

      transition: .2s;
    }


    .action-btn:hover {
      color: var(--accent);

      border-color: rgba(184,255,61,.4);

      background: rgba(184,255,61,.04);
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      padding: 55px;

      text-align: center;

      color: var(--muted);
    }


    .loading-dot {
      display: inline-block;

      width: 8px;

      height: 8px;

      margin-left: 5px;

      border-radius: 50%;

      background: var(--accent);

      animation: pulse 1s infinite;
    }


    @keyframes pulse {

      0% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .3;
      }

    }


    /* =========================================================
       ERROR
    ========================================================= */

    .error-box {
      padding: 35px 25px;

      text-align: center;
    }


    .error-box strong {
      display: block;

      color: var(--red);

      font-size: 17px;

      margin-bottom: 10px;
    }


    .error-box p {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.7;
    }


    .error-box code {
      display: inline-block;

      margin-top: 12px;

      padding: 8px 10px;

      border-radius: 8px;

      background: #0b0d10;

      color: #ff8b95;

      font-size: 11px;

      max-width: 90%;

      overflow-wrap: anywhere;
    }


    /* =========================================================
       EMPTY
    ========================================================= */

    .empty {
      padding: 55px 20px;

      text-align: center;

      color: var(--muted);

      display: none;
    }


    .empty strong {
      display: block;

      color: white;

      font-size: 17px;

      margin-bottom: 7px;
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1050px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    @media (max-width: 800px) {

      .sidebar {
        width: 70px;

        padding: 22px 9px;
      }


      .logo {
        font-size: 0;

        padding: 0;

        text-align: center;

        width: 100%;
      }


      .logo::before {
        content: "GM";

        font-size: 20px;

        color: var(--accent);
      }


      .side-label,
      .side-link span:not(.side-icon),
      .site-link {
        display: none;
      }


      .side-link {
        justify-content: center;

        padding: 13px 5px;
      }


      .sidebar-bottom {
        left: 9px;

        right: 9px;
      }


      .main {
        width: calc(100% - 70px);

        margin-left: 70px;

        padding: 25px 18px;
      }


      .topbar {
        align-items: flex-start;
      }


      h1 {
        font-size: 27px;
      }


      .filters {
        flex-direction: column;
      }


      .search {
        width: 100%;
      }


      .panel-head {
        align-items: stretch;

        flex-direction: column;
      }

    }


    @media (max-width: 520px) {

      .stats {
        grid-template-columns: 1fr 1fr;

        gap: 10px;
      }


      .stat-card {
        padding: 15px;
      }


      .stat-number {
        font-size: 24px;
      }


      .stat-icon {
        display: none;
      }


      .top-right {
        display: none;
      }

    }

  </style>
</head>

  <script>

    /* =========================================================
       GROW MATE ADMIN DASHBOARD
    ========================================================= */


    /* =========================================================
       SUPABASE CONFIG
    ========================================================= */

    const SUPABASE_URL =
      "https://ftukdnfklkhpmlvdfphj.supabase.co";


    /*
      IMPORTANT:

      Sirf PUBLISHABLE key use karni hai.

      Secret / service_role key yahan KABHI mat lagana.
    */

    const SUPABASE_KEY =
      "sb_publishable_Tm7yIAQyPuN35j7za2i9AQ_FHDASoDw";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
// ---------- LOGIN PROTECTION ----------

async function checkAdminLogin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return false;
  }

  return true;
}

checkAdminLogin();


    /* =========================================================
       VARIABLES
    ========================================================= */

    let allLeads = [];



    /* =========================================================
       DOM
    ========================================================= */

    const leadsBody =
      document.getElementById("leadsBody");


    const emptyState =
      document.getElementById("emptyState");


    const searchInput =
      document.getElementById("searchInput");


    const statusFilter =
      document.getElementById("statusFilter");


    const refreshBtn =
      document.getElementById("refreshBtn");



    /* =========================================================
       LOAD LEADS
    ========================================================= */

    async function loadLeads() {


      leadsBody.innerHTML = `

        <tr>

          <td colspan="7">

            <div class="loading">

              Loading leads
              <span class="loading-dot"></span>

            </div>

          </td>

        </tr>

      `;


      emptyState.style.display = "none";



      try {


        const result =
          await supabaseClient
            .from("leads")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        const data =
          result.data;


        const error =
          result.error;



        /* ================================================
           ERROR
        ================================================= */

        if (error) {


          console.error(
            "Supabase error:",
            error
          );


          leadsBody.innerHTML = `

            <tr>

              <td colspan="7">

                <div class="error-box">

                  <strong>
                    Could not load leads
                  </strong>

                  <p>
                    Supabase returned an error.
                    Check your table permissions / RLS policies.
                  </p>

                  <code>
                    ${escapeHTML(error.message || "Unknown error")}
                  </code>

                </div>

              </td>

            </tr>

          `;


          return;

        }



        /* ================================================
           SUCCESS
        ================================================= */

        allLeads =
          data || [];


        updateStats();


        renderLeads();


      }

      catch (err) {


        console.error(
          "Unexpected error:",
          err
        );


        leadsBody.innerHTML = `

          <tr>

            <td colspan="7">

              <div class="error-box">

                <strong>
                  Dashboard Error
                </strong>

                <p>
                  Something went wrong while connecting to Supabase.
                </p>

                <code>
                  ${escapeHTML(err.message || String(err))}
                </code>

              </div>

            </td>

          </tr>

        `;

      }

    }



    /* =========================================================
       UPDATE STATS
    ========================================================= */

    function updateStats() {


      const total =
        allLeads.length;



      const newCount =
        allLeads.filter(
          lead =>
            lead.status === "New"
        ).length;



      const progressCount =
        allLeads.filter(
          lead =>
            lead.status === "In Progress"
        ).length;



      const completedCount =
        allLeads.filter(
          lead =>
            lead.status === "Completed"
        ).length;



      document
        .getElementById("totalLeads")
        .textContent =
          total;



      document
        .getElementById("newLeads")
        .textContent =
          newCount;



      document
        .getElementById("progressLeads")
        .textContent =
          progressCount;



      document
        .getElementById("completedLeads")
        .textContent =
          completedCount;

    }



    /* =========================================================
       RENDER LEADS
    ========================================================= */

    function renderLeads() {


      const search =
        searchInput.value
          .toLowerCase()
          .trim();


      const filter =
        statusFilter.value;



      const filtered =
        allLeads.filter(
          lead => {


            const matchesSearch =

              !search ||

              String(
                lead.name || ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                lead.email || ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                lead.phone || ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                lead.service || ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                lead.message || ""
              )
              .toLowerCase()
              .includes(search);



            const matchesStatus =

              filter === "all" ||

              lead.status === filter;



            return (
              matchesSearch &&
              matchesStatus
            );

          }
        );



      /* ================================================
         EMPTY
      ================================================= */

      if (!filtered.length) {


        leadsBody.innerHTML = "";


        emptyState.style.display =
          "block";


        return;

      }


      emptyState.style.display =
        "none";



      /* ================================================
         TABLE
      ================================================= */

      leadsBody.innerHTML =

        filtered
          .map(
            lead => {


              const date =

                lead.created_at

                  ? new Date(
                      lead.created_at
                    ).toLocaleString()

                  : "—";



              const phone =
                lead.phone || "—";



              const whatsappNumber =
                phone.replace(
                  /\D/g,
                  ""
                );



              const whatsappLink =
                whatsappNumber

                  ? `https://wa.me/${whatsappNumber}`

                  : "#";



              const status =
                lead.status || "New";



              let statusClass =
                "new";



              if (
                status === "Contacted"
              ) {
                statusClass =
                  "contacted";
              }



              if (
                status === "In Progress"
              ) {
                statusClass =
                  "progress";
              }



              if (
                status === "Completed"
              ) {
                statusClass =
                  "completed";
              }



              if (
                status === "Cancelled"
              ) {
                statusClass =
                  "cancelled";
              }



              return `

                <tr>


                  <!-- CLIENT -->

                  <td>

                    <div class="client-name">

                      ${escapeHTML(
                        lead.name ||
                        "Unknown"
                      )}

                    </div>


                    <div class="client-email">

                      ${escapeHTML(
                        lead.email ||
                        "No email"
                      )}

                    </div>

                  </td>



                  <!-- PHONE -->

                  <td>

                    ${escapeHTML(
                      phone
                    )}

                  </td>



                  <!-- SERVICE -->

                  <td class="service">

                    ${escapeHTML(
                      lead.service ||
                      "—"
                    )}

                  </td>



                  <!-- MESSAGE -->

                  <td>

                    ${escapeHTML(
                      lead.message ||
                      "—"
                    )}

                  </td>



                  <!-- DATE -->

                  <td class="date">

                    ${escapeHTML(
                      date
                    )}

                  </td>



                  <!-- STATUS -->

                  <td>


                    <select

                      class="
                        status-select
                        ${statusClass}
                      "

                      data-id="${escapeHTML(
                        lead.id
                      )}"

                    >


                      <option
                        value="New"
                        ${
                          status === "New"
                            ? "selected"
                            : ""
                        }
                      >
                        New
                      </option>


                      <option
                        value="Contacted"
                        ${
                          status === "Contacted"
                            ? "selected"
                            : ""
                        }
                      >
                        Contacted
                      </option>


                      <option
                        value="In Progress"
                        ${
                          status === "In Progress"
                            ? "selected"
                            : ""
                        }
                      >
                        In Progress
                      </option>


                      <option
                        value="Completed"
                        ${
                          status === "Completed"
                            ? "selected"
                            : ""
                        }
                      >
                        Completed
                      </option>


                      <option
                        value="Cancelled"
                        ${
                          status === "Cancelled"
                            ? "selected"
                            : ""
                        }
                      >
                        Cancelled
                      </option>


                    </select>


                  </td>



                  <!-- ACTION -->

                  <td>


                    ${
                      whatsappNumber

                        ? `

                          <a

                            class="action-btn"

                            href="${whatsappLink}"

                            target="_blank"

                            rel="noopener noreferrer"

                          >

                            WhatsApp

                          </a>

                        `

                        : ""
                    }



                    ${
                      lead.email

                        ? `

                          <a

                            class="action-btn"

                            href="mailto:${encodeURIComponent(
                              lead.email
                            )}"

                          >

                            Email

                          </a>

                        `

                        : ""
                    }


                  </td>


                </tr>

              `;

            }
          )
          .join("");



      /* ================================================
         STATUS EVENTS
      ================================================= */

      document
        .querySelectorAll(
          ".status-select"
        )
        .forEach(
          select => {


            select.addEventListener(
              "change",
              async function() {


                await updateStatus(
                  this.dataset.id,
                  this.value
                );


              }
            );

          }
        );

    }



    /* =========================================================
       UPDATE STATUS
    ========================================================= */

    async function updateStatus(
      id,
      status
    ) {


      const {
        error
      } =

        await supabaseClient

          .from("leads")

          .update({
            status: status
          })

          .eq(
            "id",
            id
          );



      if (error) {


        console.error(
          "Status update error:",
          error
        );


        alert(
          "Status update failed: " +
          error.message
        );


        return;

      }



      const lead =
        allLeads.find(
          item =>
            String(item.id) ===
            String(id)
        );



      if (lead) {

        lead.status =
          status;

      }



      updateStats();


      renderLeads();

    }



    /* =========================================================
       SEARCH
    ========================================================= */

    searchInput.addEventListener(
      "input",
      renderLeads
    );



    /* =========================================================
       STATUS FILTER
    ========================================================= */

    statusFilter.addEventListener(
      "change",
      renderLeads
    );



    /* =========================================================
       REFRESH
    ========================================================= */

    refreshBtn.addEventListener(
      "click",
      loadLeads
    );



    /* =========================================================
       SECURITY HELPER
    ========================================================= */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* =========================================================
       START DASHBOARD
    ========================================================= */

    loadLeads();

  </script>

</body>
</html>
